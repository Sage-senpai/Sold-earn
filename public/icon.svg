<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SOL'D icon">
  <title>SOL'D</title>

  <defs>
    <style>
      .word {
        font-family: Unbounded, 'IBM Plex Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 110px;
        letter-spacing: -3px;
      }
      .mono {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>

  <!-- cream square -->
  <rect width="512" height="512" fill="#fbfaf5"/>
  <!-- ink border -->
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#0b0b0b" stroke-width="4"/>

  <!-- SOL'D centered -->
  <text x="256" y="282" class="word" fill="#0b0b0b" text-anchor="middle">
    SOL<tspan fill="#0f6e56" dx="-6">'</tspan>D
  </text>

  <!-- terminal accent square -->
  <rect x="244" y="312" width="24" height="24" fill="#0f6e56"/>

  <!-- mono tag -->
  <text x="256" y="372" class="mono" fill="#0b0b0b" text-anchor="middle">SALES · ON-CHAIN</text>
</svg>
